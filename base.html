<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Hasta Hayvan Bildirim Sistemi</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f5f7fb;
}

/* LOGO (SOL ÜST) */
.logo {
    position: fixed;
    top: 10px;
    left: 15px;
    width: 90px;
}

/* SAĞ GÖRSEL PANEL */
.right-images {
    position: fixed;
    right: 0;
    top: 0;
    width: 25%;
    height: 100vh;
    background: #0d47a1;
    padding: 10px;
    overflow-y: auto;
}

.right-images img {
    width: 100%;
    margin-top: 10px;
    border-radius: 10px;
}

/* ORTA ALAN */
.center {
    margin-left: 120px;
    margin-right: 26%;
    padding: 40px;
}

/* KART */
.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    width: 400px;
    margin: auto;
    box-shadow: 0px 5px 20px rgba(0,0,0,0.1);
}

input, select {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 15px;
    background: #0d47a1;
    color: white;
    border: none;
    border-radius: 8px;
}

/* TABLO */
table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
    background: white;
}

th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: center;
}

th {
    background: #0d47a1;
    color: white;
}
</style>

</head>

<body>

<!-- LOGO -->
<img class="logo" src="/static/balikesir_logo.png">

<!-- SAĞ GÖRSELLER -->
<div class="right-images">
    <img src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b">
    <img src="https://images.unsplash.com/photo-1574158622682-e40e69881006">
    <img src="https://images.unsplash.com/photo-1560807707-8cc77767d783">
    <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a">
</div>

<!-- ORTA ALAN -->
<div class="center">

    {% block content %}{% endblock %}

</div>

</body>
</html>
